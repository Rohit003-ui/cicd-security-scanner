name: IaC Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  checkov-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov and save results
        id: checkov
        run: |
          checkov -d terraform/fixed-examples/ --compact > checkov-results.txt 2>&1 || true
          cat checkov-results.txt

      - name: Post results as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = 'No results file found.';
            try {
              output = fs.readFileSync('checkov-results.txt', 'utf8');
              if (output.length > 60000) {
                output = output.substring(0, 60000) + '\n\n... (truncated)';
              }
            } catch (e) {
              console.log('Error reading results:', e.message);
            }
            const body = `### Checkov Security Scan Results\n\n\`\`\`\n${output}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Fail if issues found
        run: checkov -d terraform/fixed-examples/ --compact